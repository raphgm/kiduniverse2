# services/auth-service/k8s/secret-provider-class.yaml
# =============================================================================
# SKILL.SCH LAB EXERCISE: Monolith Service Extraction - Carving Out Auth
# STEP 2.6: Configure Azure Key Vault Secrets Store CSI Driver
# =============================================================================
# Instructions:
# 1. Replace <YOUR_KEYVAULT_NAME> with your provisioned Azure Key Vault.
# 2. Replace <AZURE_MANAGED_IDENTITY_CLIENT_ID> with the User-Assigned Managed
#    Identity configured with Key Vault "Secret User" role.
# 3. Replace <AZURE_TENANT_ID> with your Azure AD / Entra ID tenant ID.
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-csi-auth
  namespace: kiddopia-core
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # TODO [Lab Step 2.6]: Insert your Managed Identity Client ID
    userAssignedIdentityID: "${AZURE_MANAGED_IDENTITY_ID:-<AZURE_MANAGED_IDENTITY_CLIENT_ID>}"
    # TODO [Lab Step 2.6]: Insert your Azure Key Vault Name
    keyvaultName: "${AZURE_KEYVAULT_NAME:-kv-kiddopia-prod}"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - objectName: firebase-service-account
          objectType: secret
          objectVersion: ""
        - objectName: postgres-password
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID:-<AZURE_TENANT_ID>}"
